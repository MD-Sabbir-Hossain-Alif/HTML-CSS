<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Sabbir">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container">
        <header>Registration Form</header>

        <form action="#" class="form">
            <div class="input-box">
                <label for="fullName">Full Name</label>
                <input id="fullName" name="fullName" type="text" placeholder="Enter full name" required />
            </div>

            <div class="input-box">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="Enter email address" required />
            </div>

            <div class="column">
                <div class="input-box">
                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="tel" placeholder="Enter phone number" pattern="[0-9+ -]{7,15}"
                        required />
                </div>

                <div class="input-box">
                    <label for="birthDate">Birth Date</label>
                    <input id="birthDate" name="birthDate" type="date" required />
                </div>
            </div>

            <div class="gender-box">
                <h3>Gender</h3>

                <div class="gender-option">
                    <div class="gender">
                        <input type="radio" id="check-male" name="gender" value="male" checked />
                        <label for="check-male">Male</label>
                    </div>

                    <div class="gender">
                        <input type="radio" id="check-female" name="gender" value="female" />
                        <label for="check-female">Female</label>
                    </div>

                    <div class="gender">
                        <input type="radio" id="check-other" name="gender" value="prefer_not_to_say" />
                        <label for="check-other">Other</label>
                    </div>
                </div>
            </div>

            <div class="input-box address">
                <label>Address</label>
                <input type="text" name="address1" placeholder="Enter street address" required />

                <div class="column">
                    <div class="select-box">
                        <select name="country" required>
                            <option hidden>Country</option>
                            <option>Bangladesh</option>
                            <option>Palestine</option>
                            <option>Iran</option>
                            <option>Yaman</option>
                            <option>Saudi Arabia</option>
                        </select>
                    </div>

                    <input type="text" name="city" placeholder="Enter your city" required />
                </div>

                <div class="column">
                    <input type="text" name="region" placeholder="Enter your region" required />
                    <input type="text" name="postal" placeholder="Enter postal code" required />
                </div>
            </div>

            <button type="submit">Submit</button>
        </form>
    </section>
</body>

</html>
